name: 热搜聚合每日更新（早晚各一次）

on:
  push:                    # 网页改 config.json 权重后自动重跑，即时生效
    branches: [main]
    paths:
      - 'config.json'
    # 注：GITHUB_TOKEN 的推送不会再次触发本工作流，无死循环风险
  schedule:
    # cron 只认 UTC，北京时间 = UTC+8。早晚各一个时段，每段内 3 个错峰点：
    # 早段 北京 08:08 / 08:20 / 08:32  (UTC 00:08 / 00:20 / 00:32)
    # 晚段 北京 20:08 / 20:20 / 20:32  (UTC 12:08 / 12:20 / 12:32)
    # 幂等按"时段"判断：同一时段成功一次即跳过同段后续错峰点；早晚两段互不干扰。
    - cron: '08 0 * * *'   # 北京 08:08 早段
    - cron: '20 0 * * *'   # 北京 08:20 早段
    - cron: '32 0 * * *'   # 北京 08:32 早段
    - cron: '08 12 * * *'  # 北京 20:08 晚段
    - cron: '20 12 * * *'  # 北京 20:20 晚段
    - cron: '32 12 * * *'  # 北京 20:32 晚段
  workflow_dispatch:       # 手动触发
    inputs:
      slot:
        description: '时段（留空=按北京时间当前时段自动判断）'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - am
          - pm
      force:
        description: '强制刷新（忽略时段标记，重新抓取并覆盖）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hotsearch-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 计算北京时间当天与时段
        id: dt
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          HOUR=$(TZ=Asia/Shanghai date +%H)
          INPUT_SLOT="${{ inputs.slot }}"
          if [ -n "$INPUT_SLOT" ]; then
            SLOT="$INPUT_SLOT"
          elif [ "$HOUR" -lt 12 ]; then
            SLOT="am"
          else
            SLOT="pm"
          fi
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "北京时间 $TODAY $HOUR 点 → 时段 $SLOT"

      - name: 幂等检查 - 本时段是否已完成
        id: chk
        run: |
          D="${{ steps.dt.outputs.today }}"
          S="${{ steps.dt.outputs.slot }}"
          FORCE="${{ inputs.force }}"
          EVENT="${{ github.event_name }}"
          STAMP="data/.stamp-$D-$S"
          # config.json 推送 = 权重变更，必须强制重跑（不能被时段标记挡住）
          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"; echo "强制刷新模式 (event=$EVENT)"; exit 0
          fi
          if [ -f "$STAMP" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "ALREADY_DONE $D $S"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"; echo "NEED_UPDATE $D $S"
          fi

      - name: 抓取 + 筛选 + 建站
        if: steps.chk.outputs.done == 'false'
        env:
          TZ: Asia/Shanghai
        run: bash 更新数据.sh

      - name: 数据质量校验
        if: steps.chk.outputs.done == 'false'
        run: |
          python -c "
          import json,glob,sys
          f=glob.glob('data/20*.json')
          f=[x for x in f if '_' not in x.split('/')[-1]]
          assert f, 'no report file'
          d=json.load(open(sorted(f)[-1],encoding='utf-8'))
          n=sum(len(s['items']) for s in d['sections'])
          assert d.get('lead',{}).get('title') and n>=15, 'bad report: lead=%r items=%d'%(d.get('lead',{}).get('title'),n)
          idx=json.load(open('data/index.json',encoding='utf-8'))
          si=json.load(open('data/search-index.json',encoding='utf-8'))
          assert si.get('total',0)>=50 and si.get('days',0)>=1, 'bad search index'
          print('QUALITY_OK items=%d sections=%d index_dates=%d search_total=%d'%(n,len(d['sections']),len(idx['items']),si['total']))
          "

      - name: 写入时段完成标记
        if: steps.chk.outputs.done == 'false'
        run: |
          D="${{ steps.dt.outputs.today }}"
          S="${{ steps.dt.outputs.slot }}"
          printf '%s\n' "$(date -u +%FT%TZ)" > "data/.stamp-$D-$S"
          echo "STAMP_WRITTEN data/.stamp-$D-$S"

      - name: 生成本期播客音频（按天幂等，早晚段均可补）
        id: audio
        run: |
          D="${{ steps.dt.outputs.today }}"
          pip install -q edge-tts
          if [ -f "audio/$D/manifest.json" ] && python -c "
          import json,sys
          d=json.load(open('audio/$D/manifest.json',encoding='utf-8'))
          items=d.get('items') or {}
          ok=sum(1 for v in items.values() if isinstance(v,dict) and (v.get('zh') or v.get('en')))
          sys.exit(0 if ok>0 else 1)"; then
            echo "AUDIO_ALREADY_DONE $D"
          else
            python scripts/gen_audio.py "$D"
          fi

      - name: 重建播客 RSS
        run: python scripts/gen_feed.py

      - name: 提交并推送
        run: |
          EVENT="${{ github.event_name }}"
          case "$EVENT" in
            push) EVENT_LABEL="weights-updated" ;;
            workflow_dispatch) EVENT_LABEL="manual" ;;
            *) EVENT_LABEL="scheduled" ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ index.html audio/ feed.xml
          if git diff --cached --quiet; then
            echo "NO_CHANGES_SKIP"
          else
            git commit -m "Daily hotsearch digest + audio: ${{ steps.dt.outputs.today }} ${{ steps.dt.outputs.slot }} (${EVENT_LABEL})"
            git push origin HEAD:main
            echo "PUSH_OK"
          fi
